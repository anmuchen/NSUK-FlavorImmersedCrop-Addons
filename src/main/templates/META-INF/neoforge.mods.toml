modLoader="javafml"
loaderVersion="${loader_version_range}"
license="GPL 3.0"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="烟火凡人心：作物附属"
authors="XiaoLiang小亮 & 安沐尘"
logoFile="logo.png"
description='''
烟火凡人心（Flavor Immersed Daily）：作物附属。
把烟火凡人心的作物接入农田盒，由雇佣农民统一种植、收割与补种。

收录：
· 大田作物 54 种 —— 谷物（小麦、燕麦、荞麦、小米、高粱）、豆类（大豆、绿豆、红豆、豌豆）、
  薯类（甘薯、紫薯、木薯、山药、芋头）、瓜果（南瓜、冬瓜、苦瓜、丝瓜、黄瓜、茄子、
  辣椒、甜椒）、叶菜（白菜、生菜、菠菜、芹菜、韭菜、香菜）、香辛料（花椒、八角、孜然、
  小茴香、肉桂、肉豆蔻、姜、蒜、葱）、经济作物（咖啡、茶、芝麻、花生、油菜）
· 雨棚作物 9 种 —— 番茄、黄瓜、茄子、豇豆、芸豆、丝瓜、冬瓜、葡萄、青葡萄
  四角立柱 + 顶盖，由农民自建结构

农民会自己铺土壤、播种、收割并补种。
箱子里备好对应种子即可；雨棚作物还需要搭架用的材料。
'''

